---
- name: install core packages and update system
  hosts: all
  tasks:
  - name: update all packages (RHEL)
    yum:
      name: "*"
      state: latest
    when: ansible_os_family == 'RedHat'
  - name: update all packages (Debian)
    apt:
      upgrade: yes
      update_cache: yes
    when: ansible_os_family == 'Debian'
  - name: install packages
    yum:
      name: "{{ item }}"
      state: present
    loop:
      - python3
      - vim-enhanced
      - bash-completion
    when: ansible_os_family == 'RedHat'
  - name: install packages
    apt:
      name: "{{ item }}"
      state: present
    loop:
      - python3
      - vim
      - bash-completion
    when: ansible_os_family == 'Debian'

- name: setup ssh keys
  hosts: all
  tasks:
  - name: ensure ssh root login is enabled
    lineinfile:
      path: /etc/sshd/sshd_config
      state: present
      regex: "{{ item.regex }}"
      line: "{{ item.line }}"
    loop:
      - regex: '^#?PermitRootLogin'
        line: 'PermitRootLogin yes'
      - regex: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
  - name: restart ssh service
    service:
      name: sshd
      state: restarted
    when: ansible_os_family == 'RedHat'
  - name: restart ssh service
    service:
      name: ssh
      state: restarted
    when: ansible_os_family == 'Debian'
  - name: generate root ssh key pair
    community.crypto.openssh_keypair:
      path: /root/.ssh/myansible.pub
      owner: root
      group: root
    when: inventory_hostname in groups['local']
  - name: copy control root public key to nodes
    authorized_key:
      user: root
      state: present
      key: "{{ lookup('file', '/root/.ssh/myansible.pub') }}"
    when: inventory_hostname in groups['nodes']
  - name: generate /etc/hosts file with template
    template:
      src: ../files/etc_hosts.j2
      dest: /etc/hosts
  - name: toggle off ask_pass
    lineinfile:
      path: ../ansible.cfg
      regex: '^ask_pass'
      line: 'ask_pass=false'
    when: inventory_hostname in groups['local']
